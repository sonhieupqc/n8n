name: Deploy PDF Scanner to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'pdf-scanner/**'
      - '.github/workflows/deploy-pdf-scanner.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pdf-scanner-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pdf-scanner

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pdf-scanner

      - id: deployment
        uses: actions/deploy-pages@v4
